name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          # Matches Keycloak 25.0.6's own build (see pom.xml's keycloak.version
          # comment) and this repo's .tool-versions pin for local dev.
          java-version: "17"
          cache: maven
      - name: test
        run: ./mvnw --batch-mode clean test
