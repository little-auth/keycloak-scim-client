name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # A tag push doesn't go through the pull-request run, so redo it here.
  # Never publish something that hasn't passed its own gate.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      # A tag can point at any commit, including one that never went through a
      # pull request or main's branch protections. Without this check, tagging
      # is a way around every check the repository has.
      - name: tagged commit is on main
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "tag $GITHUB_REF_NAME points at $GITHUB_SHA, which is not on main" >&2
            exit 1
          fi
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: test
        run: ./mvnw --batch-mode clean test

      # The tag and pom.xml's <version> disagreeing is the classic way to
      # publish 0.1.0 twice and burn a version number. A -SNAPSHOT still on
      # pom.xml at tag time means the version bump was never actually made.
      - name: tag matches pom.xml version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          tag="${TAG#v}"
          pom_version=$(./mvnw --batch-mode help:evaluate -Dexpression=project.version -q -DforceStdout)
          if [ "$tag" != "$pom_version" ]; then
            echo "tag $tag != pom.xml $pom_version" >&2
            exit 1
          fi
      - name: build the release jar
        run: ./mvnw --batch-mode clean package -DskipTests
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: keycloak-scim-client-jar
          path: target/keycloak-scim-client-*.jar
          retention-days: 1

  # Protected by a required reviewer (repo Settings -> Environments ->
  # release) so a stray tag push can never publish on its own -- see
  # RELEASING.md for how to configure the reviewer.
  github_release:
    needs: verify
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: keycloak-scim-client-jar
          path: dist
      - name: create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --title "keycloak-scim-client ${TAG#v}"
            gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" dist/*.jar --clobber
          else
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "keycloak-scim-client ${TAG#v}" \
              --generate-notes \
              --verify-tag \
              dist/*.jar
          fi
