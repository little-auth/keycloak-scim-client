# Brings up a real Keycloak instance with keycloak-scim-client installed, pointed at
# scim-it-server (mario/scimitar's keycloak-it) running as a plain process on the host --
# not another compose service, matching mario/scimitar's own keycloak-it harness pattern.
# Dev-mode, no Postgres: this instance is disposable (thrown away on `docker compose down`).
services:
  keycloak:
    build:
      context: .
      dockerfile: Dockerfile.keycloak-scim-client
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      # `--vault=file` at build time (Dockerfile) only makes the file-vault provider
      # available -- it must ALSO be selected again at runtime via `KC_VAULT`, or
      # session.vault() silently returns Keycloak's no-op provider and every secret
      # "resolves" to empty (confirmed live: identical `KC_SPI_VAULT_FILES_PLAINTEXT_DIR`
      # config with `KC_VAULT` unset produced zero org.keycloak.vault DEBUG log output --
      # the provider factory's init()/create() were never even called). `KC_VAULT_DIR` is
      # the correct runtime directory property to pair with `KC_VAULT=file` (not the
      # SPI-prefixed `KC_SPI_VAULT_FILES_PLAINTEXT_DIR`, which despite looking more
      # "correct" per Keycloak's generic SPI-config convention had no effect here).
      # Secret filenames follow the default REALM_UNDERSCORE_KEY resolver convention:
      # `<realmName>_<vaultKey>`, referenced in config as `${vault.<vaultKey>}`. See
      # conformance/README.md for the full live-verified proof (real secret value
      # observed on the wire, not just "no error").
      KC_VAULT: file
      KC_VAULT_DIR: /opt/keycloak/data/vault
    volumes:
      - ./vault:/opt/keycloak/data/vault:ro
    ports:
      - "8091:8080"
    extra_hosts:
      # Linux Docker has no automatic host.docker.internal -- our plugin's outbound
      # requests need to reach scim-it-server on the host.
      - "host.docker.internal:host-gateway"
